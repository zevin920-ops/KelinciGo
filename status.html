
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#168747">

  <title>Pesanan Saya - KelinciGo</title>

  <link rel="stylesheet" href="kelinciGo.css">

  <style>
    body {
      background: #f5f8f5;
    }

    .status-container {
      max-width: 500px;
      margin: 30px auto;
      padding: 20px;
    }

    .status-card {
      background: white;
      padding: 24px;
      border-radius: 22px;
      box-shadow: 0 8px 25px #00000008;
    }

    .status-card h1 {
      font-size: 25px;
      margin-bottom: 10px;
    }

    .status-card > p {
      color: #777;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 20px;
    }

    .status-card input {
      width: 100%;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      box-sizing: border-box;
    }

    .status-card button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: #168747;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .back-button {
      display: block;
      text-align: center;
      margin-top: 18px;
      color: #168747;
      text-decoration: none;
      font-weight: bold;
    }

    .hasil-status {
      margin-top: 20px;
    }

    .hasil-status .detail {
      background: #f5f8f5;
      padding: 14px;
      border-radius: 12px;
      margin-top: 10px;
      font-size: 14px;
    }

    .status-badge {
      display: inline-block;
      padding: 9px 14px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      margin-top: 10px;
    }

    .menunggu {
      background: #fff4d6;
      color: #916300;
    }

    .dikonfirmasi {
      background: #dcfce7;
      color: #166534;
    }

    .ditolak {
      background: #fee2e2;
      color: #991b1b;
    }

    .status-error {
      color: #b91c1c;
      font-size: 14px;
      margin-top: 15px;
    }

    .status-success {
      color: #168747;
      font-size: 14px;
      margin-top: 15px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <!-- NAVBAR -->
  <header class="navbar">
    <div class="brand">
      <span class="logo">🐰</span>
      <span>KelinciGo</span>
    </div>
  </header>

  <main class="status-container">

    <section class="status-card">

      <h1>📋 Pesanan Saya</h1>

      <p>
        Masukkan kode pesanan yang kamu dapatkan
        setelah melakukan pemesanan.
      </p>

      <!-- INPUT KODE -->
      <label for="kodePesanan">
        Kode Pesanan
      </label>

      <input
        type="text"
        id="kodePesanan"
        placeholder="Masukkan kode pesanan"
        autocomplete="off">

      <!-- TOMBOL CEK -->
      <button
        type="button"
        id="btnCek"
        onclick="cekPesanan()">

        🔍 Cek Pesanan

      </button>

      <!-- HASIL -->
      <div
        id="hasilStatus"
        class="hasil-status"
        aria-live="polite">
      </div>

      <!-- KEMBALI -->
      <a href="index.html" class="back-button">
        ← Kembali ke Beranda
      </a>

    </section>

  </main>

  <footer>
    KelinciGo © 2026
    <p>Booking & Charter Kereta Kelinci</p>
  </footer>

  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB4y28SQw02BWQWGDIeqan7H-gEGUVOwkw",
      authDomain: "kelincigo-465eb.firebaseapp.com",
      projectId: "kelincigo-465eb",
      storageBucket: "kelincigo-465eb.firebasestorage.app",
      messagingSenderId: "214017970412",
      appId: "1:214017970412:web:7db5858a5e92dbe90c15c9"
    };

    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();


    // CEK PESANAN
    async function cekPesanan() {

      const kode = document
        .getElementById("kodePesanan")
        .value
        .trim();

      const hasil = document
        .getElementById("hasilStatus");

      const tombol = document
        .getElementById("btnCek");

      if (!kode) {
        hasil.innerHTML = `
          <p class="status-error">
            Masukkan kode pesanan terlebih dahulu.
          </p>
        `;
        return;
      }

      tombol.disabled = true;
      tombol.textContent = "Memeriksa...";

      hasil.innerHTML = "";

      try {

        // Ambil pesanan dari Firestore
        const doc = await db
          .collection("orders")
          .doc(kode)
          .get();

        if (!doc.exists) {

          hasil.innerHTML = `
            <p class="status-error">
              Pesanan tidak ditemukan.
              Periksa kembali kode pesanan kamu.
            </p>
          `;

          return;
        }

        const data = doc.data();

        const status = data.status ||
          "Menunggu konfirmasi";

        let kelasStatus = "menunggu";

        if (
          status.toLowerCase().includes("konfirmasi") &&
          !status.toLowerCase().includes("menunggu")
        ) {
          kelasStatus = "dikonfirmasi";
        }

        if (
          status.toLowerCase().includes("tolak")
        ) {
          kelasStatus = "ditolak";
        }

        hasil.innerHTML = `
          <h3>🐰 Detail Pesanan</h3>

          <span class="status-badge ${kelasStatus}">
            ${status}
          </span>

          <div class="detail">
            <p><strong>Kode:</strong></p>
            <p>${doc.id}</p>
          </div>

          <div class="detail">
            <p><strong>Nama:</strong></p>
            <p>${aman(data.nama)}</p>
          </div>

          <div class="detail">
            <p><strong>Tujuan:</strong></p>
            <p>${aman(data.tujuan)}</p>
          </div>

          <div class="detail">
            <p><strong>Tanggal:</strong></p>
            <p>${aman(data.tanggal)}</p>
          </div>

          <div class="detail">
            <p><strong>Jam:</strong></p>
            <p>${aman(data.jam)}</p>
          </div>

          <div class="detail">
            <p><strong>Jumlah Kereta:</strong></p>
            <p>${Number(data.jumlahKereta) || 1}</p>
          </div>

          <div class="detail">
            <p><strong>Jumlah Penumpang:</strong></p>
            <p>${Number(data.penumpang) || 0} orang</p>
          </div>
        `;

      
} catch (error) {

  console.error("Error cek pesanan:", error);

  hasil.innerHTML = `
    <p class="status-error">
      Gagal memeriksa pesanan.
    </p>

    <p>
      Kode error:
      ${error.code || "Tidak diketahui"}
    </p>

    <p>
      Pesan:
      ${error.message || "Tidak ada pesan error"}
    </p>
  `;
        
      } finally {

        tombol.disabled = false;
        tombol.textContent = "🔍 Cek Pesanan";

      }

    }


    // AMANKAN TEKS
    function aman(teks) {

      const div = document.createElement("div");

      div.textContent = teks || "-";

      return div.innerHTML;

    }


    // ENTER UNTUK CEK
    document
      .getElementById("kodePesanan")
      .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
          cekPesanan();
        }

      });

  </script>

</body>
</html>
