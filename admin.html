
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin KelinciGo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f1f8f2;
    margin: 0;
    padding: 20px;
    color: #183b27;
}

button, input, select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

.login-box {
    max-width: 400px;
    margin: 60px auto;
    padding: 25px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 5px 20px #0001;
}

h2 {
    text-align: center;
    color: #247a45;
}

input {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border-radius: 12px;
    border: 1px solid #ddd;
    font-size: 16px;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border-radius: 12px;
    border: none;
    background: #247a45;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

#pesan {
    text-align: center;
    color: #c0392b;
    margin-top: 12px;
    overflow-wrap: anywhere;
}

.container {
    max-width: 900px;
    margin: 20px auto;
}

.header {
    background: white;
    padding: 20px;
    border-radius: 18px;
    margin-bottom: 20px;
}

.header h2 {
    margin-top: 0;
}

.kartu {
    background: white;
    padding: 20px;
    margin: 15px 0;
    border-radius: 18px;
    box-shadow: 0 3px 12px #0001;
    overflow-wrap: anywhere;
}

.kartu h3 {
    color: #247a45;
    margin-top: 0;
}

.kartu p {
    line-height: 1.6;
    font-size: 14px;
}

.label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    font-size: 14px;
}

select {
    width: 100%;
    padding: 13px;
    margin-top: 8px;
    border-radius: 10px;
    border: 1px solid #ccc;
    background: white;
    font-size: 15px;
}

.detail-item {
    background: white;
    padding: 15px;
    margin: 10px 0;
    border-radius: 12px;
    box-shadow: 0 2px 8px #0001;
}

.detail-item strong {
    color: #247a45;
}

.detail-item p {
    overflow-wrap: anywhere;
    line-height: 1.6;
}

.btn-detail {
    background: #0f766e;
}

.btn-save {
    background: #2563eb;
}

.btn-back {
    background: #64748b;
}

.btn-reload {
    background: #168747;
}

.btn-logout {
    background: #dc2626;
}

.status-badge {
    display: inline-block;
    padding: 7px 12px;
    border-radius: 10px;
    background: #e9f7ee;
    color: #176b38;
    font-size: 13px;
    font-weight: bold;
}

.empty {
    background: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
}

@media (max-width: 480px) {
    body {
        padding: 12px;
    }

    .login-box {
        margin: 30px auto;
        padding: 20px;
    }

    .kartu {
        padding: 16px;
    }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="formLogin" class="login-box">

    <h2>🐰 KelinciGo Admin</h2>

    <p style="text-align:center">
        Login untuk mengelola pesanan
    </p>

    <input
        type="email"
        id="email"
        placeholder="Email admin"
        autocomplete="username"
    >

    <input
        type="password"
        id="password"
        placeholder="Password admin"
        autocomplete="current-password"
    >

    <button id="tombolLogin" onclick="loginAdmin()">
        Login
    </button>

    <p id="pesan"></p>

</div>

<!-- DAFTAR PESANAN -->
<div id="daftarPesanan" class="container" style="display:none">

    <div class="header">

        <h2>📋 Daftar Pesanan</h2>

        <button
            onclick="location.href='dashboard.html'"
        >
            🏠 Kembali ke Dashboard
        </button>

        <button
            class="btn-reload"
            onclick="muatPesanan()"
        >
            🔄 Muat Ulang Pesanan
        </button>

        <button
            class="btn-logout"
            onclick="logoutAdmin()"
        >
            🚪 Logout
        </button>

    </div>

    <div id="pesanan"></div>

</div>

<!-- DETAIL PESANAN -->
<div id="halamanDetail" class="container" style="display:none">

    <div class="header">

        <h2>📋 Detail Pesanan</h2>

        <button
            class="btn-back"
            onclick="tutupDetail()"
        >
            ← Kembali ke Daftar Pesanan
        </button>

    </div>

    <div id="isiDetail"></div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>

// ==========================
// FIREBASE CONFIG
// ==========================

const firebaseConfig = {
    apiKey: "AIzaSyB4y28SQw02BWQWGDIeqan7H-gEGUVOwkw",
    authDomain: "kelincigo-465eb.firebaseapp.com",
    projectId: "kelincigo-465eb",
    storageBucket: "kelincigo-465eb.firebasestorage.app",
    messagingSenderId: "214017970412",
    appId: "1:214017970412:web:7db5858a5e92dbe90c15c9"
};

// ==========================
// INITIALIZE FIREBASE
// ==========================

if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();

// ==========================
// ADMIN UID
// ==========================

const ADMIN_UID = "i0u692Syc5MMBQ2XoVeJgDgZIPN2";

// ==========================
// STATUS PESANAN
// ==========================

const daftarStatus = [
    "Menunggu konfirmasi",
    "Dikonfirmasi",
    "Dalam perjalanan",
    "Selesai",
    "Dibatalkan"
];

// ==========================
// PERSISTENCE
// ==========================

auth.setPersistence(
    firebase.auth.Auth.Persistence.LOCAL
).catch(function(error) {

    console.error(
        "Gagal menyimpan login:",
        error.message
    );

});

// ==========================
// AUTH STATE
// ==========================

auth.onAuthStateChanged(async function(user) {

    const formLogin = document.getElementById("formLogin");

    const daftar = document.getElementById("daftarPesanan");

    const halamanDetail = document.getElementById("halamanDetail");

    const pesan = document.getElementById("pesan");

    if (!user) {

        formLogin.style.display = "block";

        daftar.style.display = "none";

        halamanDetail.style.display = "none";

        return;

    }

    // Pastikan UID sesuai dengan Rules Firebase
    if (user.uid !== ADMIN_UID) {

        await auth.signOut();

        formLogin.style.display = "block";

        daftar.style.display = "none";

        halamanDetail.style.display = "none";

        pesan.style.color = "red";

        pesan.textContent =
            "Akun ini tidak memiliki akses admin.";

        return;

    }

    formLogin.style.display = "none";

    daftar.style.display = "block";

    halamanDetail.style.display = "none";

    muatPesanan();

});

// ==========================
// LOGIN ADMIN
// ==========================

async function loginAdmin() {

    const email = document
        .getElementById("email")
        .value.trim();

    const password = document
        .getElementById("password")
        .value;

    const pesan = document.getElementById("pesan");

    const tombol = document.getElementById("tombolLogin");

    pesan.style.color = "#c0392b";

    if (!email || !password) {

        pesan.textContent =
            "Masukkan email dan password terlebih dahulu.";

        return;

    }

    tombol.disabled = true;

    tombol.textContent = "Memproses login...";

    pesan.textContent = "";

    try {

        await auth.setPersistence(
            firebase.auth.Auth.Persistence.LOCAL
        );

        const hasil = await auth.signInWithEmailAndPassword(
            email,
            password
        );

        if (hasil.user.uid !== ADMIN_UID) {

            await auth.signOut();

            throw new Error(
                "Akun ini bukan admin KelinciGo."
            );

        }

        pesan.style.color = "green";

        pesan.textContent = "Login berhasil!";

    } catch (error) {

        pesan.style.color = "red";

        pesan.textContent =
            "Login gagal: " + error.message;

    } finally {

        tombol.disabled = false;

        tombol.textContent = "Login";

    }

}

// ==========================
// LOGOUT
// ==========================

async function logoutAdmin() {

    const yakin = confirm(
        "Apakah kamu yakin ingin logout?"
    );

    if (!yakin) return;

    try {

        await auth.signOut();

    } catch (error) {

        alert(
            "Gagal logout: " + error.message
        );

    }

}

// ==========================
// MUAT PESANAN
// ==========================

async function muatPesanan() {

    const tempat = document.getElementById("pesanan");

    tempat.textContent = "Memuat pesanan...";

    document.getElementById("daftarPesanan").style.display = "block";

    document.getElementById("halamanDetail").style.display = "none";

    try {

        const snapshot = await db
            .collection("orders")
            .orderBy("dibuatPada", "desc")
            .get();

        tempat.innerHTML = "";

        if (snapshot.empty) {

            tempat.innerHTML =
                '<div class="empty">Belum ada pesanan.</div>';

            return;

        }

        snapshot.forEach(function(doc) {

            const data = doc.data();

            const idPesanan = doc.id;

            const kartu = document.createElement("div");

            kartu.className = "kartu";

            // ==========================
            // NAMA
            // ==========================

            const judul = document.createElement("h3");

            judul.textContent =
                data.nama || "Pelanggan";

            kartu.appendChild(judul);

            // ==========================
            // STATUS
            // ==========================

            const badge = document.createElement("span");

            badge.className = "status-badge";

            badge.textContent =
                data.status || "Menunggu konfirmasi";

            kartu.appendChild(badge);

            // ==========================
            // INFORMASI PESANAN
            // ==========================

            const detail = document.createElement("div");

            const informasi = [

                "📱 WhatsApp: " + (data.whatsapp || "-"),

                "📍 Jemput: " + (data.jemput || "-"),

                "🏁 Tujuan: " + (data.tujuan || "-"),

                "📅 Tanggal: " + (data.tanggal || "-"),

                "🕒 Jam: " + (data.jam || "-"),

                "👥 Penumpang: " + (data.penumpang || "-")

            ];

            informasi.forEach(function(teks) {

                const p = document.createElement("p");

                p.textContent = teks;

                detail.appendChild(p);

            });

            kartu.appendChild(detail);

            // ==========================
            // DETAIL BUTTON
            // ==========================

            const tombolDetail = document.createElement("button");

            tombolDetail.className = "btn-detail";

            tombolDetail.textContent =
                "🔍 Detail Pesanan";

            tombolDetail.onclick = function() {

                tampilDetail(data, idPesanan);

            };

            kartu.appendChild(tombolDetail);

            // ==========================
            // LABEL STATUS
            // ==========================

            const label = document.createElement("label");

            label.className = "label";

            label.textContent =
                "Status pesanan:";

            kartu.appendChild(label);

            // ==========================
            // SELECT STATUS
            // ==========================

            const pilih = document.createElement("select");

            daftarStatus.forEach(function(status) {

                const opsi = document.createElement("option");

                opsi.value = status;

                opsi.textContent = status;

                pilih.appendChild(opsi);

            });

            pilih.value = daftarStatus.includes(data.status)
                ? data.status
                : "Menunggu konfirmasi";

            kartu.appendChild(pilih);

            // ==========================
            // SAVE STATUS
            // ==========================

            const tombolSimpan = document.createElement("button");

            tombolSimpan.className = "btn-save";

            tombolSimpan.textContent =
                "💾 Simpan Status";

            tombolSimpan.onclick = async function() {

                const statusBaru = pilih.value;

                const statusLama =
                    data.status || "Menunggu konfirmasi";

                if (statusBaru === statusLama) {

                    alert("Status belum berubah.");

                    return;

                }

                const yakin = confirm(
                    "Ubah status pesanan menjadi:\n\n"
                    + statusBaru
                    + "?"
                );

                if (!yakin) return;

                tombolSimpan.disabled = true;

                tombolSimpan.textContent =
                    "Menyimpan...";

                try {

                    // Pastikan admin masih login
                    const user = auth.currentUser;

                    if (!user || user.uid !== ADMIN_UID) {

                        throw new Error(
                            "Sesi admin tidak valid. Silakan login kembali."
                        );

                    }

                    // Referensi orders
                    const orderRef = db
                        .collection("orders")
                        .doc(idPesanan);

                    // Referensi tracking
                    const trackingRef = db
                        .collection("tracking")
                        .doc(idPesanan);

                    // Batch untuk update keduanya
                    const batch = db.batch();

                    // Update status orders
                    batch.update(orderRef, {
                        status: statusBaru
                    });

                    // Update status tracking
                    batch.set(trackingRef, {
                        status: statusBaru
                    });

                    // Simpan keduanya sekaligus
                    await batch.commit();

                    alert(
                        "Status berhasil diperbarui!\n\n"
                        + "Status: "
                        + statusBaru
                    );

                    // Muat ulang
                    await muatPesanan();

                } catch (error) {

                    console.error(
                        "Gagal menyimpan status:",
                        error
                    );

                    alert(
                        "Gagal menyimpan status:\n"
                        + error.message
                    );

                    tombolSimpan.disabled = false;

                    tombolSimpan.textContent =
                        "💾 Simpan Status";

                }

            };

            kartu.appendChild(tombolSimpan);

            tempat.appendChild(kartu);

        });

    } catch (error) {

        console.error(
            "Gagal memuat pesanan:",
            error
        );

        tempat.textContent =
            "Gagal memuat pesanan: "
            + error.message;

    }

}

// ==========================
// DETAIL PESANAN
// ==========================

function tampilDetail(data, idPesanan) {

    const daftar = document.getElementById("daftarPesanan");

    const halaman = document.getElementById("halamanDetail");

    const isi = document.getElementById("isiDetail");

    isi.innerHTML = "";

    const dataDetail = [

        ["Kode Pesanan", idPesanan],

        ["Nama Pelanggan", data.nama],

        ["WhatsApp", data.whatsapp],

        ["Lokasi Jemput", data.jemput],

        ["Tujuan", data.tujuan],

        ["Tanggal", data.tanggal],

        ["Jam", data.jam],

        ["Jumlah Penumpang", data.penumpang],

        ["Status", data.status || "Menunggu konfirmasi"]

    ];

    dataDetail.forEach(function(item) {

        const kartu = document.createElement("div");

        kartu.className = "detail-item";

        const judul = document.createElement("strong");

        judul.textContent = item[0];

        const nilai = document.createElement("p");

        nilai.textContent =
            item[1] == null ? "-" : String(item[1]);

        kartu.appendChild(judul);

        kartu.appendChild(nilai);

        isi.appendChild(kartu);

    });

    daftar.style.display = "none";

    halaman.style.display = "block";

}

// ==========================
// KEMBALI KE DAFTAR
// ==========================

function tutupDetail() {

    document.getElementById("halamanDetail").style.display = "none";

    document.getElementById("daftarPesanan").style.display = "block";

}

</script>

</body>
</html>
